# Development services: only PostgreSQL. The site runs on the host (`make dev`).
# The credentials are for this local database only and match .env.example.
name: ohw-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ohw
      POSTGRES_PASSWORD: ohw
      POSTGRES_DB: ohw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohw -d ohw"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
