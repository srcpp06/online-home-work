{% load ui %}
<label class="upload-zone mt-1" data-upload>
  <input type="{{ widget.type }}"
         name="{{ widget.name }}"
         class="sr-only"
         {% include "django/forms/widgets/attrs.html" %}>
  <span class="flex items-start gap-2">{% icon "upload" "size-5 shrink-0 mt-0.5" %}<span>{{ widget.prompt }} yoki <span class="text-ink underline">kompyuterdan tanlang</span></span></span>
  <span class="upload-zone-file" data-upload-file hidden></span>
</label>
