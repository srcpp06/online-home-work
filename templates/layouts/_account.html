{% load ui %}
{% if user.is_authenticated %}
  <div class="px-5 py-4 border-t border-grid text-sm">
    <div class="font-semibold">{{ user.display_name }}</div>
    <div class="text-text-2">{{ user.get_role_display }}</div>
    <a class="mt-3 inline-block" href="{% url 'accounts:password_change' %}">Parolni almashtirish</a>
    <form class="mt-2" method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="inline-flex items-center gap-2 text-ink cursor-pointer"
              type="submit">{% icon "log-out" "size-4" %}Chiqish</button>
    </form>
  </div>
{% endif %}
