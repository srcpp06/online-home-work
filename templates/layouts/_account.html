{% load ui people %}
{% if user.is_authenticated %}
  <div class="px-5 py-4 border-t border-grid text-sm">
    <a class="account-link" href="{% url 'accounts:profile' %}">
      {% avatar user "sm" %}
      <span class="min-w-0">
        <span class="block font-semibold truncate">{{ user.display_name }}</span>
        <span class="block text-text-2">{{ user.get_role_display }}</span>
      </span>
    </a>
    <form class="mt-3" method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="inline-flex items-center gap-2 text-ink cursor-pointer"
              type="submit">{% icon "log-out" "size-4" %}Chiqish</button>
    </form>
  </div>
{% endif %}
