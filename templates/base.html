{% load static %}
<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}{% endblock %}
    — Online Home Work</title>
    <link rel="preload"
          href="{% static 'fonts/golos-text-latin-400-normal.woff2' %}"
          as="font"
          type="font/woff2"
          crossorigin>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
  </head>
  <body class="min-h-dvh bg-desk text-text"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block body %}{% endblock %}
  </body>
</html>
